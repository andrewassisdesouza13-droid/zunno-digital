<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFC · Zunno Digital</title>
<meta name="description" content="Aprenda a vender Plaquinha NFC pra negócios locais.">
<link rel="icon" href="favicon.png">
<style>
  :root {
    --bg: #0a0a09;
    --bg-2: #111110;
    --accent: #d8ff5a;
    --text: #f4efe5;
    --text-dim: #9a978c;
    --border: rgba(216,255,90,0.18);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 20px 80px;
    min-height: 100vh;
  }
  .wrap { width: 100%; max-width: 420px; }
  .badge {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--border);
    background: rgba(216,255,90,0.08);
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 27px;
    line-height: 1.3;
    margin: 0 0 10px;
  }
  h1 span { color: var(--accent); }
  .sub {
    color: var(--text-dim);
    font-size: 15px;
    line-height: 1.55;
    margin: 0 0 28px;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    margin-bottom: 12px;
    border: 1px solid transparent;
  }
  .btn-primary { background: var(--accent); color: #0a0a09; }
  .btn-secondary { background: var(--bg-2); color: var(--text); border-color: var(--border); }
  .math {
    display: flex;
    margin-top: 32px;
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }
  .math div { flex: 1; padding: 16px 8px; text-align: center; }
  .math div + div { border-left: 1px solid var(--border); }
  .math strong { display: block; font-size: 18px; color: var(--accent); }
  .math span { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
  footer {
    margin-top: 40px;
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
  }
  footer a { color: var(--text-dim); }
</style>
</head>
<body>
  <div class="wrap">
    <span class="badge">Oportunidade NFC</span>
    <h1>Vendo <span>Plaquinha NFC</span> pra negócio local</h1>
    <p class="sub">Placa de avaliação Google por aproximação. Fornecedor, produto e abordagem prontos pra você replicar.</p>

    <a class="btn btn-primary" href="https://wa.me/5516981030458?text=Quero%20saber%20mais%20sobre%20a%20Plaquinha%20NFC" target="_blank" rel="noopener">Falar com o fornecedor</a>
    <a class="btn btn-secondary" href="/curso">Ver o curso (em construção)</a>

    <div class="math">
      <div><strong>R$12</strong><span>Você compra</span></div>
      <div><strong>R$80</strong><span>Você vende</span></div>
      <div><strong>R$68</strong><span>Lucro/placa</span></div>
    </div>

    <footer>por <a href="https://zunno.digital" target="_blank" rel="noopener">Zunno Digital</a></footer>
  </div>
</body>
</html>
